<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
     <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark =
          stored === "dark" ||
          (!stored &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
