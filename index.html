<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
     <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark =
          stored === "dark" ||
          (!stored &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);

        /*
         * Surface for the very first paint, before React mounts and
         * RootLayout takes over. Without this the landing page briefly
         * renders with the app scrollbar (and a dark color-scheme, for a
         * visitor whose OS is dark) before flipping to light.
         * Keep this list in sync with LIGHT_PATHS in
         * src/pages/site/sections.js.
         */
        var path = window.location.pathname;
        var surface = "app";
        var light = ["/", "/bima-sakhi", "/benefits", "/procedure", "/career", "/apply",
          "/contact", "/why-lic", "/be-your-own-boss", "/explore-india", "/handbook",
          "/login", "/register"];
        if (light.indexOf(path) !== -1) surface = "light";
        document.documentElement.setAttribute("data-surface", surface);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand-mark-orange.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Become an LIC Agent with Rohit Lal</title>
    <meta name="theme-color" content="#FBF8F3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request for every family the site uses (it used to be split between
      this tag and an @import in index.css, which loaded DM Sans twice and hid
      the rest behind the stylesheet). DM Sans is the practical web substitute
      for proprietary Google Sans; swap when licensed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Kalam:wght@400;700&family=Mukta:wght@400;500;600;700;800&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
     <div id="portal-root"></div> 
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
